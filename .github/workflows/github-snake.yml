name: Generate Snake Animation

on:
  schedule:
    # runs once a day at 00:00 UTC
    - cron: "0 0 * * *"
  workflow_dispatch: {}
  push:
    branches:
      - main
      - master

permissions:
  contents: write

jobs:
  generate:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Generate github-contribution-grid-snake.svg
        uses: Platane/snk/svg-only@v3
        with:
          github_user_name: Mohammadsiraj07
          outputs: |
            dist/github-contribution-grid-snake.svg?color_snake=%23ff4fa3&color_dots=%23241238,%232a0e3d,%237b2ff7,%239b5de5,%23ff4fa3&color_stroke=%23ff4fa3
            dist/github-contribution-grid-snake-dark.svg?palette=github-dark&color_snake=%23ff6fb5
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Push snake svg to the output branch
        uses: crazy-max/ghaction-github-pages@v4
        with:
          target_branch: output
          build_dir: dist
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
